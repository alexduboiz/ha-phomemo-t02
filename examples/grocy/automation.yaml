- alias: Grocy - print label on the Phomemo T02
  id: grocy_phomemo_label
  description: >-
    Receives Grocy's label printer webhook and prints a grocycode QR with the
    product name underneath.
  mode: queued
  max: 10
  triggers:
    - trigger: webhook
      webhook_id: phomemo_grocy_label
      allowed_methods: [POST]
      local_only: true
  conditions:
    # Ignore malformed posts rather than printing a blank label.
    - condition: template
      value_template: "{{ trigger.json.grocycode is defined and trigger.json.grocycode }}"
  actions:
    - action: phomemo_t02.print_qr
      data:
        data: "{{ trigger.json.grocycode }}"
        caption: "{{ trigger.json.product | default('', true) }}"
        size: Medium
        align: center

